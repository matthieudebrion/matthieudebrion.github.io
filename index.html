<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matthieu de Brion</title>
  <meta name="description" content="Working notes and longer articles on how models work and what that implies.">
  <style>
    :root {
      --sans: -apple-system, system-ui, "Segoe UI", Roboto, Oxygen, Ubuntu,
        Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
      --duke-blue: #012169;
      --color-dark: #1f1f1e;
    }

    html {
      font-size: 16px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--color-dark);
      font-family: var(--sans);
    }

    main {
      box-sizing: border-box;
      max-width: 840px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    h1 {
      max-width: 500px;
      margin: 100px auto 0;
      font-size: 40px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    h1 span { display: block; }

    p {
      max-width: 500px;
      margin: 16px auto 0;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.7);
    }

    nav {
      max-width: 500px;
      margin: 80px auto 0;
      font-size: 14px;
    }

    a { color: var(--color-dark); }
    a:hover { color: var(--duke-blue); }

  </style>
</head>
<body>
  <main>
    <h1><span>Matthieu</span><span>de Brion</span></h1>
    <p>Working notes and longer articles on how models work and what that implies:
      interpretability, the mathematics of transformers, path dependence, multi-agent
      safety, and whatever the next note actually is.</p>
    <nav aria-label="Sites">
      <a href="https://matthieudebrion.github.io/cristal/">Cristal</a>
    </nav>
  </main>
</body>
</html>
